org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=26.2
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[26.2]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=26.2.0.84
loader_version_range=[4,)

# Pass --enable-preview to the forked recompiler process that recompiles Minecraft sources.
# This is required because NeoForm-transformed Minecraft 26.1 sources use Java 25 preview
# features (e.g. flexible constructors, Reader.readAllAsString()).
neogradle.subsystems.recompiler.args=--enable-preview
neogradle.subsystems.recompiler.jvmArgs=-enable-preview

mod_id=quickexp
mod_name=QuickExp
mod_license=MIT
mod_version=1.0.0

mod_group_id=cardejibka.quickexp
mod_authors=CardeJIbka
mod_description=A mod that allows rapid throwing of experience bottles by holding right-click.